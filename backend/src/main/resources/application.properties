app.name=Okane Transfer
server.port=8080

db.driver-class-name=com.mysql.cj.jdbc.Driver
db.url=${DB_URL:jdbc:mysql://localhost:3306/okane_transfer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:sielxiter}
db.hikari.pool-name=OkaneTransferPool
db.hikari.maximum-pool-size=10
db.hikari.minimum-idle=2
db.hikari.connection-timeout=30000

jpa.dialect=org.hibernate.dialect.MySQLDialect
jpa.show-sql=true
jpa.format-sql=true
jpa.hbm2ddl.auto=update
jpa.packages-to-scan=com.okane
