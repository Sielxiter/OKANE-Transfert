app.name=Okane Transfer
server.port=8080

db.driver-class-name=com.mysql.cj.jdbc.Driver
db.url=${DB_URL:jdbc:mysql://localhost:3306/okane_transfer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:}
db.hikari.pool-name=OkaneTransferPool
db.hikari.maximum-pool-size=10
db.hikari.minimum-idle=2
db.hikari.connection-timeout=30000

jpa.dialect=org.hibernate.dialect.MySQLDialect
jpa.show-sql=true
jpa.format-sql=true
jpa.hbm2ddl.auto=update
jpa.packages-to-scan=com.okane

app.frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:4200}
app.jwt.secret=${JWT_SECRET:OkaneTransferJwtSecretKeyChangeThisBeforeProduction-1234567890}
app.jwt.issuer=${JWT_ISSUER:Okane Transfer}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:60}
app.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:7}
app.auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
app.auth.login.window-minutes=${AUTH_LOGIN_WINDOW_MINUTES:10}

logging.level.com.okane=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE