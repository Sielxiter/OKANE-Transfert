services:
  mysql:
    image: mysql:8.0
    container_name: okane-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: okane_password
      MYSQL_DATABASE: okane_transfer
      MYSQL_USER: okane_user
      MYSQL_PASSWORD: okane_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - okane-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pokane_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: okane-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/okane_transfer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: okane_password
      JWT_SECRET: ${JWT_SECRET:-f9f4c5b7d1e2a8c93b6e7f104d5a8c2b91f3e6d7a4b8c5f2e9d1a7b3c6f8e4d2}
      JWT_ISSUER: Okane Transfer
      JWT_ACCESS_TOKEN_MINUTES: 60
      JWT_REFRESH_TOKEN_DAYS: 7
      FRONTEND_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://frontend,http://13.48.181.188,http://13.48.181.188:*
      AUTH_LOGIN_MAX_ATTEMPTS: 5
      AUTH_LOGIN_WINDOW_MINUTES: 10
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_SIZE_MB: 5
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_AUTH_ENABLED: ${SMTP_AUTH_ENABLED:-true}
      SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-true}
    ports:
      - "8081:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - okane-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./Okane-frontend
      dockerfile: Dockerfile
    container_name: okane-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - okane-network

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  okane-network:
    driver: bridge
