<div class="login-shell" [class.dark]="darkMode">
  <div class="grid min-h-svh lg:grid-cols-2">
    <div class="flex flex-col gap-4 p-6 md:p-10">
      <div class="flex items-center justify-between gap-2">
        <a routerLink="/login" class="brand">
          <div class="brand-mark">O</div>
          <span>Okane Transfer</span>
        </a>

        <button type="button" class="theme-toggle" (click)="toggleTheme()">
          Mode {{ darkMode ? 'clair' : 'sombre' }}
        </button>
      </div>

      <div class="flex flex-1 items-center justify-center">
        <div class="w-full max-w-xs">
          <form class="login-form">
            <div class="form-heading">
              <h1 class="title">Connexion à votre compte</h1>
              <p class="subtitle">Entrez votre courriel pour accéder à Okane Transfer</p>
            </div>

            <div class="field">
              <label for="email">Courriel</label>
              <input id="email" type="email" placeholder="m@example.com" />
            </div>

            <div class="field">
              <div class="field-head">
                <label for="password">Mot de passe</label>
                <a routerLink="/login">Mot de passe oublié ?</a>
              </div>
              <input id="password" type="password" placeholder="********" />
            </div>

            <div class="field">
              <button type="button" class="primary-btn">Se connecter</button>
            </div>

            <div class="separator">Ou continuer avec</div>

            <div class="field">
              <button type="button" class="outline-btn">
                Connexion avec GitHub
              </button>
              <p class="signup">
                Pas encore de compte ?
                <a routerLink="/login">Créer un compte</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="hidden lg:block image-panel">
      <img
        src="https://images.unsplash.com/photo-1604076850742-4c7221f3101b?q=80&w=1887&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        alt="Agence de transfert"
        class="cover-image"
      />
    </div>
  </div>
</div>
